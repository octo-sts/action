name: 'Octo STS'
description: |
  This action exchanges the workflow's identity token for a Github App token
  from the Octo STS service, in accordance with the trust policy of the target
  organization or repository.

inputs:
  domain:
    description: |
      The domain of the Octo STS instance to use to federate.
    default: octo-sts.dev

  scheme:
    description: |
      URL scheme used to reach the Octo STS instance: 'https' (default) or 'http'.
      Use 'http' ONLY for a self-hosted broker on a trusted network — e.g. a
      ClusterIP Service reached in-cluster and restricted by NetworkPolicy, where
      TLS is intentionally not terminated. Never use 'http' over an untrusted
      network: the request carries the OIDC token and the response carries the
      minted GitHub token.
    default: https

  scope:
    description: |
      The org/repo of the repository to which to request access.
    required: true

  identity:
    description: |
      The name of the trust policy to load from the target repository. The trust policy
      is loaded from https://github.com/{scope} from the file
      .github/chainguard/{identity}.sts.yaml
    required: true

outputs:
  token:
    description: |
      The federated token to use for authentication.
    value: ${{ steps.octo-sts.outputs.token }}

runs:
  using: 'node24'
  main: 'index.js'
  post: 'post.js'
